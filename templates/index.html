<!doctype html>
<html>
<head>
  <title>Book Search</title>
</head>
<body>
  <h1>Book Search</h1>
  <form action="/" method="get">
    <input type="text" name="q" value="{{ query }}" placeholder="Search books...">
    <button type="submit">Search</button>
  </form>

  {% if query %}
    <h2>Results for "{{ query }}"</h2>
    <ul>
      {% for book in results %}
        <li>{{ book }}</li>
      {% endfor %}
    </ul>
    {% if not results %}
      <p>No books found.</p>
    {% endif %}
  {% endif %}
</body>
</html>
